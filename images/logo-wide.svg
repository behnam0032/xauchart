<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1000 300"
  width="1000"
  height="300"
  fill="none"
>
  <defs>

    <linearGradient
      id="gold"
      x1="50"
      y1="20"
      x2="250"
      y2="220"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0" stop-color="#FFF3A0"/>
      <stop offset="0.25" stop-color="#FFD84A"/>
      <stop offset="0.55" stop-color="#EAB92C"/>
      <stop offset="0.8" stop-color="#C99618"/>
      <stop offset="1" stop-color="#F5D65A"/>
    </linearGradient>

    <linearGradient
      id="dark"
      x1="50"
      y1="30"
      x2="250"
      y2="220"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0" stop-color="#667085"/>
      <stop offset="0.5" stop-color="#344054"/>
      <stop offset="1" stop-color="#171B24"/>
    </linearGradient>

    <filter
      id="shadow"
      x="-30%"
      y="-30%"
      width="160%"
      height="160%"
    >
      <feDropShadow
        dx="0"
        dy="5"
        stdDeviation="5"
        flood-color="#f2ebeb"
        flood-opacity="0.22"
      />
    </filter>

  </defs>

  <g transform="translate(-30, -10)" filter="url(#shadow)">

    <path
      d="
        M 137 72
        L 188 72
        L 363 247
        L 312 247
        Z
      "
      fill="url(#dark)"
    />

    <path
      d="
        M 312 72
        L 363 72
        L 188 247
        L 137 247
        Z
      "
      fill="url(#gold)"
    />

    <path
      d="M 139 246 L 315 71"
      stroke="#111827"
      stroke-width="3"
      stroke-linecap="round"
      opacity="0.35"
    />

  </g>



  <text
    x="380"
    y="175"
    text-anchor="start"
    font-family="Inter, Montserrat, Arial, Helvetica, sans-serif"
    font-size="85"
    font-weight="700"
    letter-spacing="-2"
  >
    <tspan fill="url(#gold)">XAU</tspan><tspan fill="#F2F4F7">Chart</tspan>
  </text>

  <path
    d="M 385 205 H 1000"
    stroke="#C9A227"
    stroke-width="3.5"
    opacity="0.55"
    stroke-linecap="round"
  />

</svg>